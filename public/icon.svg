<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3A28" />
      <stop offset="100%" stop-color="#1A2417" />
    </linearGradient>
    <linearGradient id="chiliGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#588157" />
      <stop offset="100%" stop-color="#A3B18A" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Glow / Ambient circle -->
  <circle cx="256" cy="256" r="180" fill="#E9EDC9" opacity="0.04" />

  <!-- Chili Plant elements grouped & centered -->
  <g transform="translate(141, 120)">
    <!-- Central curved chili fruit -->
    <path d="M125 150 C125 100 100 80 105 50 C105 50 115 45 115 50 C110 75 140 100 145 150 C150 190 140 230 115 260 C90 290 55 310 40 315 C38 316 35 312 36 310 C45 300 75 270 95 230 C115 190 125 170 125 150 Z" fill="url(#chiliGrad)" />
    
    <!-- Red Accent shadow/glare for Chili -->
    <path d="M115 150 C115 110 95 90 100 70 C100 120 130 150 130 180 C130 200 125 220 110 240 C95 255 75 270 60 280 C80 260 100 220 115 150 Z" fill="#FCA5A5" opacity="0.4" />

    <!-- Green Stem and Leaves -->
    <!-- Stem connected to Chili top -->
    <path d="M105 50 C115 40 130 25 150 20 C140 35 125 45 115 50 " stroke="#588157" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Left leafy branch -->
    <path d="M120 70 C80 50 20 80 10 130 C40 130 90 110 120 70 Z" fill="url(#leafGrad)" />
    <path d="M120 70 C100 85 60 95 15 115 C45 105 85 95 120 70 Z" fill="#2D3A28" opacity="0.15" />

    <!-- Right leafy branch -->
    <path d="M130 90 C170 75 210 100 220 140 C190 145 150 125 130 90 Z" fill="url(#leafGrad)" />
    <path d="M130 90 C145 105 175 115 210 125 C180 115 150 105 130 90 Z" fill="#2D3A28" opacity="0.15" />

    <!-- Left Small accessory leaf -->
    <path d="M110 130 C80 120 50 140 45 170 C65 170 95 155 110 130 Z" fill="#588157" />
  </g>
</svg>
